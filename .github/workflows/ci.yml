# Checks each pull request: analysis and tests.
name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Fails on errors only: the warnings inherited from Musly remain.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: >-
          flutter test
          test/services test/models test/providers test/widgets
          test/octave test/widget_test.dart
