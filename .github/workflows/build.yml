name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.8)'
        required: true
        type: string

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  # Validate secrets exist
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "⚠️ Warning: ANDROID_KEYSTORE_BASE64 secret not set. Will use debug keystore (builds may fail signature checks)."
          else
            echo "✅ ANDROID_KEYSTORE_BASE64 secret is configured"
          fi
        continue-on-error: true

  # Android Build
  build-android:
    runs-on: ubuntu-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        run: |
          DART_VERSION=$(dart --version 2>&1 | grep -E -o '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "✅ Dart SDK version: $DART_VERSION"
      
      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "Decoding keystore from base64..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/musly-release.keystore
          
          # Create key.properties
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=musly-release.keystore
          EOF
          
          echo "✅ Keystore configured for signing"
      
      - name: Build APKs
        run: |
          echo "Building APKs..."
          flutter build apk --release
      
      - name: Build AppBundle
        run: |
          echo "Building AppBundle..."
          flutter build appbundle --release
      
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # iOS Build (macOS required)
  build-ios:
    runs-on: macos-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        run: |
          DART_VERSION=$(dart --version 2>&1 | grep -E -o '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "✅ Dart SDK version: $DART_VERSION"
      
      - name: Disable Swift Package Manager (maintain iOS 15 support)
        run: |
          flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install && cd ..
      
      - name: Build iOS (no codesign for testing)
        run: |
          flutter build ios --release --no-codesign
      
      - name: Create IPA
        run: |
          ls -la build/ios/
          APP_DIR=$(find build/ios -type d -name "Runner.app" | head -1)
          if [ -n "$APP_DIR" ]; then
            echo "Found Runner.app at $APP_DIR"
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            zip -r musly-ios.ipa Payload
            rm -rf Payload
          else
            echo "::error::Runner.app not found in build/ios!"
            exit 1
          fi
      
      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: musly-ios.ipa
          if-no-files-found: error

  # Windows Build
  build-windows:
    runs-on: windows-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        shell: pwsh
        run: |
          $DART_VERSION = (dart --version 2>&1 | Select-String -Pattern 'Dart SDK version: ([0-9]+\.[0-9]+\.[0-9]+)').Matches.Groups[1].Value
          Write-Host "✅ Dart SDK version: $DART_VERSION"
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Windows
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          _CL_: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter build windows failed with exit code $LASTEXITCODE"
          }
      
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DMUSLY_VERSION="${{ github.event.inputs.version }}" installer.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS compilation failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "musly-setup.exe")) {
            throw "NSIS build failed: musly-setup.exe was not created!"
          }
          Write-Host "✅ NSIS installer successfully built: musly-setup.exe"

      - name: Prepare Windows Package
        shell: pwsh
        run: |
          if (-not (Test-Path "musly-setup.exe")) {
            throw "Fatal: musly-setup.exe is missing before packaging!"
          }
          New-Item -ItemType Directory -Force -Path windows_package
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "windows_package\" -Recurse -Force
          Copy-Item -Path "musly-setup.exe" -Destination "windows_package\" -Force

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows_package/
          if-no-files-found: error

  # Linux Build
  build-linux:
    runs-on: ubuntu-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev libnotify-dev libsecret-1-dev libjsoncpp-dev libmpv-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev rpm alien zstd squashfs-tools flatpak desktop-file-utils
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        run: |
          DART_VERSION=$(dart --version 2>&1 | grep -E -o '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "✅ Dart SDK version: $DART_VERSION"
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Linux
        run: |
          flutter build linux --release

      - name: Package Linux Distributions (.deb, .rpm, .pkg.tar.zst, .AppImage, .flatpak, .snap, .tar.gz)
        run: |
          VERSION="${{ github.event.inputs.version }}"
          mkdir -p linux_packages

          # 1. Portable tar.gz
          tar -czf "linux_packages/musly-linux-x64.tar.gz" -C build/linux/x64/release/bundle .

          # Base directory tree
          mkdir -p dist/deb/DEBIAN
          mkdir -p dist/deb/usr/bin
          mkdir -p dist/deb/usr/lib/musly
          mkdir -p dist/deb/usr/share/applications
          mkdir -p dist/deb/usr/share/icons/hicolor/512x512/apps

          cp -r build/linux/x64/release/bundle/* dist/deb/usr/lib/musly/
          cp "assets/Musly Icon.png" dist/deb/usr/share/icons/hicolor/512x512/apps/musly.png

          echo '#!/bin/sh' > dist/deb/usr/bin/musly
          echo 'exec /usr/lib/musly/musly "$@"' >> dist/deb/usr/bin/musly
          chmod 755 dist/deb/usr/bin/musly

          echo '[Desktop Entry]' > dist/deb/usr/share/applications/musly.desktop
          echo 'Name=Musly' >> dist/deb/usr/share/applications/musly.desktop
          echo 'Comment=Universal Music Streaming Player & Client' >> dist/deb/usr/share/applications/musly.desktop
          echo 'Exec=/usr/bin/musly %U' >> dist/deb/usr/share/applications/musly.desktop
          echo 'Icon=musly' >> dist/deb/usr/share/applications/musly.desktop
          echo 'Terminal=false' >> dist/deb/usr/share/applications/musly.desktop
          echo 'Type=Application' >> dist/deb/usr/share/applications/musly.desktop
          echo 'Categories=AudioVideo;Audio;Player;Music;' >> dist/deb/usr/share/applications/musly.desktop
          echo 'StartupWMClass=musly' >> dist/deb/usr/share/applications/musly.desktop
          chmod 644 dist/deb/usr/share/applications/musly.desktop

          # 2. Debian / Ubuntu (.deb)
          INST_SIZE=$(du -sk dist/deb/usr | cut -f1)
          echo "Package: musly" > dist/deb/DEBIAN/control
          echo "Version: ${VERSION}" >> dist/deb/DEBIAN/control
          echo "Architecture: amd64" >> dist/deb/DEBIAN/control
          echo "Maintainer: dddevid <devidrru@gmail.com>" >> dist/deb/DEBIAN/control
          echo "Installed-Size: ${INST_SIZE}" >> dist/deb/DEBIAN/control
          echo "Depends: libgtk-3-0, libnotify4, libsecret-1-0, libmpv2 | libmpv1, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0" >> dist/deb/DEBIAN/control
          echo "Section: sound" >> dist/deb/DEBIAN/control
          echo "Priority: optional" >> dist/deb/DEBIAN/control
          echo "Homepage: https://musly.devid.lol" >> dist/deb/DEBIAN/control
          echo "Description: Universal Music Streaming Player & Client" >> dist/deb/DEBIAN/control
          echo " Musly is a modern, elegant music streaming client for Navidrome, Subsonic," >> dist/deb/DEBIAN/control
          echo " and other Subsonic servers." >> dist/deb/DEBIAN/control
          dpkg-deb --build --root-owner-group dist/deb "linux_packages/musly_${VERSION}_amd64.deb"

          # 3. RedHat / Fedora / openSUSE (.rpm)
          alien --to-rpm --scripts "linux_packages/musly_${VERSION}_amd64.deb" || true
          if ls musly*.rpm 1> /dev/null 2>&1; then
            mv musly*.rpm "linux_packages/musly-${VERSION}-1.x86_64.rpm"
          fi

          # 4. Arch Linux / pacman (.pkg.tar.zst)
          mkdir -p dist/arch/usr
          cp -r dist/deb/usr/* dist/arch/usr/
          INST_SIZE_BYTES=$(du -sb dist/arch/usr | cut -f1)
          echo "pkgname = musly" > dist/arch/.PKGINFO
          echo "pkgver = ${VERSION}-1" >> dist/arch/.PKGINFO
          echo "pkgdesc = Universal Music Streaming Player & Client" >> dist/arch/.PKGINFO
          echo "url = https://musly.devid.lol" >> dist/arch/.PKGINFO
          echo "builddate = $(date +%s)" >> dist/arch/.PKGINFO
          echo "packager = dddevid <devidrru@gmail.com>" >> dist/arch/.PKGINFO
          echo "size = ${INST_SIZE_BYTES}" >> dist/arch/.PKGINFO
          echo "arch = x86_64" >> dist/arch/.PKGINFO
          echo "license = MIT" >> dist/arch/.PKGINFO
          echo "depend = gtk3" >> dist/arch/.PKGINFO
          echo "depend = libnotify" >> dist/arch/.PKGINFO
          echo "depend = libsecret" >> dist/arch/.PKGINFO
          echo "depend = mpv" >> dist/arch/.PKGINFO
          echo "depend = gstreamer" >> dist/arch/.PKGINFO
          echo "depend = gst-plugins-base" >> dist/arch/.PKGINFO
          (cd dist/arch && tar -cf - .PKGINFO usr | zstd -c > "../../linux_packages/musly-${VERSION}-x86_64.pkg.tar.zst") || true

          # 5. AppImage (.AppImage)
          mkdir -p dist/appimage/AppDir/usr/bin
          mkdir -p dist/appimage/AppDir/usr/lib/musly
          mkdir -p dist/appimage/AppDir/usr/share/applications
          mkdir -p dist/appimage/AppDir/usr/share/icons/hicolor/512x512/apps

          cp -r build/linux/x64/release/bundle/* dist/appimage/AppDir/usr/lib/musly/
          cp "assets/Musly Icon.png" dist/appimage/AppDir/usr/share/icons/hicolor/512x512/apps/musly.png
          cp "assets/Musly Icon.png" dist/appimage/AppDir/musly.png
          cp "assets/Musly Icon.png" dist/appimage/AppDir/.DirIcon
          cp dist/deb/usr/share/applications/musly.desktop dist/appimage/AppDir/musly.desktop

          echo '#!/bin/sh' > dist/appimage/AppDir/AppRun
          echo 'SELF=$(readlink -f "$0")' >> dist/appimage/AppDir/AppRun
          echo 'HERE=${SELF%/*}' >> dist/appimage/AppDir/AppRun
          echo 'export PATH="${HERE}/usr/bin:${PATH}"' >> dist/appimage/AppDir/AppRun
          echo 'export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/lib/musly/lib:${LD_LIBRARY_PATH}"' >> dist/appimage/AppDir/AppRun
          echo 'exec "${HERE}/usr/lib/musly/musly" "$@"' >> dist/appimage/AppDir/AppRun
          chmod +x dist/appimage/AppDir/AppRun

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage || wget -q https://github.com/AppImage/AppImageKit/releases/download/12/appimagetool-x86_64.AppImage -O appimagetool.AppImage || true
          chmod +x appimagetool.AppImage || true
          ./appimagetool.AppImage --appimage-extract || true
          if [ -f "./squashfs-root/AppRun" ]; then
            ARCH=x86_64 ./squashfs-root/AppRun dist/appimage/AppDir "linux_packages/musly-${VERSION}-x86_64.AppImage" || true
          fi

          # 6. Flatpak bundle (.flatpak)
          if command -v flatpak >/dev/null 2>&1; then
            mkdir -p dist/flatpak/app/files
            mkdir -p dist/flatpak/app/export/share/applications
            mkdir -p dist/flatpak/app/export/share/icons/hicolor/512x512/apps

            cp -r build/linux/x64/release/bundle/* dist/flatpak/app/files/
            cp "assets/Musly Icon.png" dist/flatpak/app/export/share/icons/hicolor/512x512/apps/com.dddevid.Musly.png

            echo '[Desktop Entry]' > dist/flatpak/app/export/share/applications/com.dddevid.Musly.desktop
            echo 'Name=Musly' >> dist/flatpak/app/export/share/applications/com.dddevid.Musly.desktop
            echo 'Comment=Universal Music Streaming Player & Client' >> dist/flatpak/app/export/share/applications/com.dddevid.Musly.desktop
            echo 'Exec=musly %U' >> dist/flatpak/app/export/share/applications/com.dddevid.Musly.desktop
            echo 'Icon=com.dddevid.Musly' >> dist/flatpak/app/export/share/applications/com.dddevid.Musly.desktop
            echo 'Terminal=false' >> dist/flatpak/app/export/share/applications/com.dddevid.Musly.desktop
            echo 'Type=Application' >> dist/flatpak/app/export/share/applications/com.dddevid.Musly.desktop
            echo 'Categories=AudioVideo;Audio;Player;Music;' >> dist/flatpak/app/export/share/applications/com.dddevid.Musly.desktop
            echo 'StartupWMClass=musly' >> dist/flatpak/app/export/share/applications/com.dddevid.Musly.desktop

            echo '[Application]' > dist/flatpak/app/metadata
            echo 'name=com.dddevid.Musly' >> dist/flatpak/app/metadata
            echo 'runtime=org.freedesktop.Platform/x86_64/24.04' >> dist/flatpak/app/metadata
            echo 'sdk=org.freedesktop.Sdk/x86_64/24.04' >> dist/flatpak/app/metadata
            echo 'command=musly' >> dist/flatpak/app/metadata
            echo '' >> dist/flatpak/app/metadata
            echo '[Context]' >> dist/flatpak/app/metadata
            echo 'shared=network;ipc;' >> dist/flatpak/app/metadata
            echo 'sockets=x11;wayland;pulseaudio;fallback-x11;' >> dist/flatpak/app/metadata
            echo 'devices=all;' >> dist/flatpak/app/metadata
            echo 'filesystems=host;xdg-run/dconf;~/.config/dconf:ro;' >> dist/flatpak/app/metadata

            ostree init --mode=archive-z2 --repo=repo || true
            flatpak build-export repo dist/flatpak/app master || flatpak build-export repo dist/flatpak/app || true
            flatpak build-bundle repo "linux_packages/musly-${VERSION}-x86_64.flatpak" com.dddevid.Musly master || flatpak build-bundle repo "linux_packages/musly-${VERSION}-x86_64.flatpak" com.dddevid.Musly || true
          fi

          # 7. Snap package (.snap)
          mkdir -p dist/snap/meta/gui
          mkdir -p dist/snap/musly
          cp -r build/linux/x64/release/bundle/* dist/snap/musly/
          cp "assets/Musly Icon.png" dist/snap/meta/gui/icon.png
          cp dist/deb/usr/share/applications/musly.desktop dist/snap/meta/gui/musly.desktop

          echo "name: musly" > dist/snap/meta/snap.yaml
          echo "version: '${VERSION}'" >> dist/snap/meta/snap.yaml
          echo "summary: Universal Music Streaming Player & Client" >> dist/snap/meta/snap.yaml
          echo "description: Universal music streaming client for Navidrome, Subsonic, and other Subsonic servers." >> dist/snap/meta/snap.yaml
          echo "architectures:" >> dist/snap/meta/snap.yaml
          echo "  - amd64" >> dist/snap/meta/snap.yaml
          echo "base: core24" >> dist/snap/meta/snap.yaml
          echo "grade: stable" >> dist/snap/meta/snap.yaml
          echo "confinement: classic" >> dist/snap/meta/snap.yaml
          echo "apps:" >> dist/snap/meta/snap.yaml
          echo "  musly:" >> dist/snap/meta/snap.yaml
          echo "    command: musly/musly" >> dist/snap/meta/snap.yaml

          mksquashfs dist/snap "linux_packages/musly_${VERSION}_amd64.snap" -noappend -comp xz || true

          echo "Generated Linux packages:"
          ls -lh linux_packages/
      
      - name: Upload Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: linux_packages/*
          if-no-files-found: error

  # macOS Build
  build-macos:
    runs-on: macos-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        run: |
          DART_VERSION=$(dart --version 2>&1 | grep -E -o '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "✅ Dart SDK version: $DART_VERSION"
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build macOS
        run: |
          flutter build macos --release
      
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          set -e
          APP_PATH="build/macos/Build/Products/Release/musly.app"
          DMG_NAME="musly-macos.dmg"

          if [ ! -f "packaging/macos/dmg_background.png" ]; then
            echo "::error::packaging/macos/dmg_background.png is missing!"
            exit 1
          fi

          echo "Verifying app exists at $APP_PATH..."
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App not found at $APP_PATH"
            ls -la build/macos/Build/Products/Release/
            exit 1
          fi

          rm -f "$DMG_NAME"

          echo "Generating DMG installer with drag-and-drop background..."
          create-dmg \
            --volname "Musly" \
            --background "packaging/macos/dmg_background.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 120 \
            --icon "musly.app" 180 190 \
            --hide-extension "musly.app" \
            --app-drop-link 480 190 \
            "$DMG_NAME" \
            "$APP_PATH" || true

          if [ ! -f "$DMG_NAME" ]; then
            echo "::error::Fatal: create-dmg failed to create $DMG_NAME!"
            exit 1
          fi

          echo "Verifying DMG integrity with hdiutil..."
          hdiutil imageinfo "$DMG_NAME" > /dev/null

          ls -lh "$DMG_NAME"
          echo "✅ DMG created and verified successfully!"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: musly-macos.dmg
          if-no-files-found: error

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/
          if-no-files-found: error

  # Create Release with all artifacts
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-windows, build-linux, build-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or Update Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push --force origin "v${{ github.event.inputs.version }}"

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android/

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: artifacts/ios/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/linux/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/macos/

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos-dmg/

      - name: Package Windows
        run: |
          if [ ! -f "artifacts/windows/musly-setup.exe" ]; then
            echo "::error::Fatal: musly-setup.exe is missing from artifacts/windows! Halting release."
            exit 1
          fi
          cd artifacts/windows
          zip -r ../../musly-windows.zip . -x "musly-setup.exe"
          cd ../..

      - name: Verify Linux Packages
        run: |
          echo "Listing Linux release packages:"
          ls -lh artifacts/linux/

      - name: Package macOS
        run: |
          cp artifacts/macos-dmg/*.dmg musly-macos.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Musly v${{ github.event.inputs.version }}
          fail_on_unmatched_files: false
          body: |
            ## 🎉 Musly v${{ github.event.inputs.version }}

            ### 📦 Downloads

            **Android:**
            - `app-release.apk` (universal APK for all devices)

            **iOS:**
            - `musly-ios.ipa` (sideload with AltStore, Sideloadly, or similar — not signed, iOS 15.0+)

            **Windows:**
            - `musly-setup.exe` (setup installer, run to install Musly)
            - `musly-windows.zip` (portable version, extract and run)

            **macOS:**
            - `musly-macos.dmg` (drag Musly.app to Applications — not notarized)

            **Linux:**
            - `*.deb` (Debian, Ubuntu, Linux Mint)
            - `*.rpm` (Fedora, RHEL, openSUSE)
            - `*.pkg.tar.zst` (Arch Linux, Manjaro)
            - `*.AppImage` (Universal AppImage for any distro)
            - `*.flatpak` (Flatpak standalone bundle)
            - `*.snap` (Snap package)
